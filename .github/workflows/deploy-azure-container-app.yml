name: Test and Deploy Sales Reporting Service

on:
  push:
    branches:
      - main
    paths:
      - '.dockerignore'
      - '.github/workflows/deploy-azure-container-app.yml'
      - 'docker/**'
      - 'Contracts/**'
      - 'Controllers/**'
      - 'Data/**'
      - 'Domain/**'
      - 'Services/**'
      - 'tests/**'
      - 'Program.cs'
      - 'appsettings*.json'
      - '*.csproj'
      - '*.sln'
      - '*.slnx'
  workflow_dispatch:

# Keep only the newest production deployment for this service.
concurrency:
  group: medzo-sales-reporting-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: medzo-pharmacy/medzo-sales-reporting-service
  CONTAINER_APP_NAME: medzo-sales-reporting-service
  RESOURCE_GROUP: rg-MEDZO-NEW

jobs:
  test-build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and test
        run: |
          dotnet restore Medzo.SalesReporting.slnx
          dotnet test Medzo.SalesReporting.slnx --configuration Release --no-restore

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        run: |
          docker build \
            --file docker/Dockerfile \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Validate Azure OpenID Connect variables
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          : "${AZURE_CLIENT_ID:?Add repository Actions variable AZURE_CLIENT_ID}"
          : "${AZURE_TENANT_ID:?Add repository Actions variable AZURE_TENANT_ID}"
          : "${AZURE_SUBSCRIPTION_ID:?Add repository Actions variable AZURE_SUBSCRIPTION_ID}"
          : "${GHCR_USERNAME:?Add repository Actions secret GHCR_USERNAME}"
          : "${GHCR_TOKEN:?Add repository Actions secret GHCR_TOKEN}"

      - name: Log in to Azure using OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          registryUrl: ${{ env.REGISTRY }}
          registryUsername: ${{ secrets.GHCR_USERNAME }}
          registryPassword: ${{ secrets.GHCR_TOKEN }}

      - name: Verify deployed health endpoint
        uses: azure/cli@v2
        with:
          inlineScript: |
            fqdn=$(az containerapp show \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query 'properties.configuration.ingress.fqdn' \
              --output tsv)
            test -n "$fqdn"
            curl --fail --retry 6 --retry-all-errors --retry-delay 10 "https://$fqdn/health"
